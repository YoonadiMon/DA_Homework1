services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
    environment:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ct127
      PGPASSWORD: ct127
      PGDATABASE: ct127
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ct127
      POSTGRES_PASSWORD: ct127
      POSTGRES_DB: ct127
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct127 -d ct127"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
